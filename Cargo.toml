[package]
name = "glazier"
version = "0.3.1"
edition = "2021"
description = "shadcn/ui-inspired component set for egui/eframe"
license = "MIT"
repository = "https://github.com/42Pupusas/glazier"
readme = "README.md"
keywords = ["egui", "eframe", "ui", "components", "gui"]
categories = ["gui"]
exclude = ["PLAN.md"]

[features]
system-fonts = []

[dependencies]
# Glazier components exchange egui types with their host application. Keep this
# release line aligned so widget values never cross incompatible egui versions.
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }

[dev-dependencies]
eframe = "0.36"

[lints.clippy]
style = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
